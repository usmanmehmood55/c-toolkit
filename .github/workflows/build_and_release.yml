name: Build and Release

on:
  push:
    branches:
      - main
      - pre_release

# Marketplace versions and GitHub tags are global to the project, so releases
# from the stable and pre-release branches must not run at the same time.
concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Check for version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version=$(node -p "require('./package.json').version")
          previous_version=''

          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            previous_version=$(git show "${BEFORE_SHA}:package.json" | node -e \
              "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")
          fi

          echo "Previous version: ${previous_version:-not available}"
          echo "Current version: $current_version"
          echo "current=$current_version" >> "$GITHUB_OUTPUT"

          if [[ -z "$previous_version" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "The previous package version could not be read; publishing is skipped for safety."
          elif [[ "$previous_version" != "$current_version" ]]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "The version did not change; validation passed and publishing will be skipped."
          fi

      - name: Set release metadata
        if: steps.version.outputs.bumped == 'true'
        id: release
        env:
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          package_name=$(node -p "require('./package.json').name")

          if [[ "$GITHUB_REF_NAME" == 'pre_release' ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "package_flag=--pre-release" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}-pre" >> "$GITHUB_OUTPUT"
            echo "release_name=Pre-release ${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "package_flag=" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${VERSION}" >> "$GITHUB_OUTPUT"
          fi

          echo "artifact=${package_name}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package extension
        if: steps.version.outputs.bumped == 'true'
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          PACKAGE_FLAG: ${{ steps.release.outputs.package_flag }}
        run: npx --no-install vsce package $PACKAGE_FLAG --out "$ARTIFACT"

      - name: Verify Marketplace credentials
        if: steps.version.outputs.bumped == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PUBLISH_PAT }}
        run: npx --no-install vsce verify-pat --pat "$VSCE_PAT" UsmanMehmood

      - name: Publish packaged extension to Marketplace
        if: steps.version.outputs.bumped == 'true'
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          PACKAGE_FLAG: ${{ steps.release.outputs.package_flag }}
          VSCE_PAT: ${{ secrets.VSCE_PUBLISH_PAT }}
        run: npx --no-install vsce publish $PACKAGE_FLAG --packagePath "$ARTIFACT" --pat "$VSCE_PAT" --skip-duplicate

      - name: Create GitHub release
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.release_name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.release.outputs.artifact }}
